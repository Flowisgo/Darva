<svg xmlns="http://www.w3.org/2000/svg" width="38in" height="27in" viewBox="0 0 3800 2700">
<title>RugDealer: Would you sell this rug today?</title>
<rect id="board" width="3800" height="2700" fill="#f4ede0"/>
<g id="center">
<text x="1900" y="440" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="280" font-weight="800" fill="#1f1a17" text-anchor="middle" letter-spacing="-5.6">RugDealer</text>
<g id="rug-slot"><rect x="1460" y="580" width="880" height="1260" fill="none" stroke="#9b2a22" stroke-width="10" stroke-dasharray="40 26"/><text x="1900" y="1170" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="700" fill="#9b2a22" text-anchor="middle" letter-spacing="-1.4">Signature rug</text><text x="1900" y="1270" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="400" fill="#9b2a22" text-anchor="middle" letter-spacing="-1.4">image goes here</text></g>
<text x="1900" y="2030" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="105" font-weight="500" fill="#5c524a" text-anchor="middle" letter-spacing="-2.1">You need cash now.</text>
<text x="1900" y="2240" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="175" font-weight="800" fill="#1f1a17" text-anchor="middle" letter-spacing="-3.5">Would you sell</text>
<text x="1900" y="2440" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="175" font-weight="800" fill="#1f1a17" text-anchor="middle" letter-spacing="-3.5">this rug <tspan fill="#9b2a22">today?</tspan></text>
</g>
<g id="left">
<text x="120" y="760" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="230" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-4.6">Sell</text>
<text x="120" y="990" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="230" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-4.6">today.</text>
<rect x="120" y="1110" width="220" height="14" fill="#9b2a22"/>
<text x="120" y="1340" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="500" fill="#1f1a17" text-anchor="start" letter-spacing="-2.2">Cash now.</text>
<text x="120" y="1500" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="500" fill="#1f1a17" text-anchor="start" letter-spacing="-2.2">The sale</text>
<text x="120" y="1640" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="500" fill="#1f1a17" text-anchor="start" letter-spacing="-2.2">is final.</text>
<g id="rug-gone" fill="none" stroke="#5c524a" stroke-width="8"><rect x="120" y="1900" width="300" height="430" stroke-dasharray="24 18"/><path d="M480 2115 H760 M700 2055 L760 2115 L700 2175" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g id="right">
<text x="2900" y="500" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="165" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-3.3">Take an</text>
<text x="2900" y="680" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="165" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-3.3">advance.</text>
<rect x="2900" y="790" width="220" height="14" fill="#9b2a22"/>
<text x="2900" y="1010" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="500" fill="#1f1a17" text-anchor="start" letter-spacing="-1.9">Cash now.</text>
<text x="2900" y="1130" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="400" fill="#5c524a" text-anchor="start" letter-spacing="-1.3">A rug shop holds the rug.</text>
<text x="2900" y="1340" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-1.4">Repay</text><text x="2900" y="1430" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="400" fill="#5c524a" text-anchor="start" letter-spacing="-1.3">Reclaim the rug.</text>
<line x1="2900" y1="1530" x2="3050" y2="1530" stroke="#9b2a22" stroke-width="6"/><text x="3090" y="1552" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#9b2a22" text-anchor="start" letter-spacing="-1.3">or</text><line x1="3190" y1="1530" x2="3680" y2="1530" stroke="#9b2a22" stroke-width="6"/>
<text x="2900" y="1680" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-1.4">Not repaid</text><text x="2900" y="1770" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="400" fill="#5c524a" text-anchor="start" letter-spacing="-1.3">The shop can buy it out.</text>
<line x1="2900" y1="1870" x2="3050" y2="1870" stroke="#9b2a22" stroke-width="6"/><text x="3090" y="1892" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#9b2a22" text-anchor="start" letter-spacing="-1.3">or</text><line x1="3190" y1="1870" x2="3680" y2="1870" stroke="#9b2a22" stroke-width="6"/>
<text x="2900" y="2020" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" fill="#1f1a17" text-anchor="start" letter-spacing="-1.4">Shop misses window</text><text x="2900" y="2110" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="400" fill="#5c524a" text-anchor="start" letter-spacing="-1.3">The investor can claim it.</text>
<text x="2900" y="2250" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="400" fill="#5c524a" text-anchor="start" letter-spacing="-1.2" font-style="italic">Any resale happens separately.</text>
<text x="2900" y="2440" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="500" fill="#1f1a17" text-anchor="start" letter-spacing="-1.0">One lead partner, with additional</text>
<text x="2900" y="2510" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="500" fill="#1f1a17" text-anchor="start" letter-spacing="-1.0">partners interested in participating.</text>
</g>
<g id="fold-lines"><rect x="940" y="0" width="20" height="2700" fill="#000" opacity="0.05"/><rect x="2840" y="0" width="20" height="2700" fill="#000" opacity="0.05"/><line x1="950" y1="0" x2="950" y2="2700" stroke="#000" stroke-opacity="0.22" stroke-width="3"/><line x1="2850" y1="0" x2="2850" y2="2700" stroke="#000" stroke-opacity="0.22" stroke-width="3"/></g>
</svg>
